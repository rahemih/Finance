name: Bug / Incident
description: Report a reproducible defect or operational problem
title: "[BUG] "
labels: []
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - SEV-3
        - SEV-2
        - SEV-1
        - SEV-0
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / logs / reproduction
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and safety state
