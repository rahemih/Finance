name: P24 Agent Trace Telemetry Validation

on:
  pull_request:
    paths:
      - 'contracts/tasks/FIN-P24-WZ-002.json'
      - 'docs/09-agents/automation/FIN-P24-WZ-002.md'
      - 'scripts/automation/agent_trace.py'
      - 'tests/automation/test_agent_trace.py'
      - 'tests/automation/test_trace_browser.js'
      - 'apps/agent-mission-control/**'
      - '.github/workflows/p24-agent-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p24-agent-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline_trace_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout with no credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Python negative tests
        run: python -m unittest discover -s tests/automation -p 'test_agent_trace.py' -v
      - name: Browser validation and JS syntax tests
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/agent-mission-control/app.js
          node --check apps/agent-mission-control/trace-ui.js
          node tests/automation/test_trace_browser.js
