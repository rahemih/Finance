name: Governance Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify governance baseline
        run: python3 scripts/verify_governance.py

      - name: Validate task contract schema JSON
        run: python3 -m json.tool contracts/schemas/task-contract.schema.json >/dev/null

      - name: Validate PR branch name
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/check_branch_name.py

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify Node.js version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(cat .node-version)"

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.28.4 --activate
          test "$(pnpm --version)" = "11.28.4"

      - name: Verify pnpm lockfile without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'

      - name: Verify Python version
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python $(cat .python-version)"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'

      - name: Verify uv version and locked Python sync
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv sync --locked --no-install-project

      - name: Developer environment doctor
        run: python scripts/dev/doctor.py --ci

      - name: Developer tooling contract
        run: python scripts/ci/developer_tooling_contract.py

      - name: Foundation lint
        run: python scripts/ci/foundation_ci.py lint

      - name: Typecheck readiness
        run: python scripts/ci/foundation_ci.py typecheck

      - name: Strict product typecheck
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
        with:
          version: '1.1.414'
          project: pyrightconfig.json
          python-version: '3.14'
          annotate: errors

      - name: CI foundation unit self-checks
        run: python scripts/ci/foundation_ci.py unit

      - name: Forward Task Contract validation
        run: python scripts/ci/foundation_ci.py contract

      - name: Config / environment contract
        run: python scripts/ci/config_contract.py

      - name: Branch hygiene archive contract
        run: python scripts/ci/branch_hygiene_archive.py


      - name: Foundation test harness
        run: python -m unittest discover -s tests/foundation -p 'test_*.py' -v

      - name: P05 real-time data tests
        run: python -m unittest discover -s tests/p05 -p 'test_*.py' -v

      - name: P05-A boundary revalidation
        run: python scripts/ci/p05a_revalidation.py

      - name: P05-A deterministic adapter evidence twice
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/p05a_evidence.py --output build/p05a-a.json
          python scripts/ci/p05a_evidence.py --output build/p05a-b.json
          cmp build/p05a-a.json build/p05a-b.json
