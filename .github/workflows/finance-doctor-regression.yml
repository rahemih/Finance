name: Finance Doctor Regression Verification

on:
  pull_request:
    paths:
      - 'scripts/dev/doctor.py'
      - 'tests/foundation/test_dev_doctor.py'
      - '.github/workflows/finance-doctor-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-doctor-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer_doctor_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without saved repository credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set project Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Compile developer doctor and regression tests
        run: python -m py_compile scripts/dev/doctor.py tests/foundation/test_dev_doctor.py
      - name: Execute fail-closed developer doctor regression tests
        run: python -m unittest discover -s tests/foundation -p 'test_dev_doctor.py' -v
