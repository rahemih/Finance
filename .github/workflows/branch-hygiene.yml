name: Branch Hygiene

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged task branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const defaultBranch = context.payload.repository.default_branch || 'main';

            if (!branch || branch === defaultBranch || branch === 'main') {
              core.info(`Skip protected/canonical branch: ${branch}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.notice(`Deleted merged branch: ${branch}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`Branch already absent or not deletable: ${branch}`);
                return;
              }
              throw error;
            }

  cleanup-known-merged:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches proven merged
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref)
            );

            for (const branch of branches) {
              if (branch.name === defaultBranch || branch.name === 'main') continue;
              if (openHeads.has(branch.name)) {
                core.info(`Keep open-PR branch: ${branch.name}`);
                continue;
              }

              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: branch.commit.sha,
                  per_page: 100,
                }
              );

              const provenMerged = associated.some(pr =>
                pr.merged_at &&
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                pr.head.ref === branch.name &&
                pr.head.sha === branch.commit.sha
              );

              let deleteReason = null;

              if (provenMerged) {
                deleteReason = 'exact merged-PR proof';
              } else if (!branch.protected) {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${defaultBranch}...${branch.name}`,
                });

                if (comparison.data.ahead_by === 0) {
                  deleteReason = `fully absorbed into ${defaultBranch}; ahead_by=0`;
                } else {
                  core.info(
                    `Keep branch with unique commits: ${branch.name} ` +
                    `(ahead=${comparison.data.ahead_by}, behind=${comparison.data.behind_by})`
                  );
                }
              } else {
                core.info(`Keep protected branch without exact merged-PR proof: ${branch.name}`);
              }

              if (!deleteReason) continue;

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                core.notice(`Deleted branch ${branch.name}: ${deleteReason}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent or not deletable: ${branch.name}`);
                  continue;
                }
                throw error;
              }
            }

  audit:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [cleanup-known-merged]
    runs-on: ubuntu-latest
    env:
      STALE_DAYS: "30"
      MAX_NON_CANONICAL_BRANCHES: "12"
      REPORT_TITLE: "[BRANCH-HYGIENE] Stale or excessive branches"
    steps:
      - name: Audit branch inventory
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const staleDays = Number(process.env.STALE_DAYS);
            const maxBranches = Number(process.env.MAX_NON_CANONICAL_BRANCHES);
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            const archiveResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'config/governance/branch-hygiene-archive.json',
              ref: defaultBranch,
            });
            if (
              Array.isArray(archiveResponse.data) ||
              archiveResponse.data.type !== 'file' ||
              !archiveResponse.data.content
            ) {
              throw new Error('Branch hygiene archive registry must be a file.');
            }
            const archive = JSON.parse(
              Buffer.from(archiveResponse.data.content, 'base64').toString('utf8')
            );
            if (archive.kind !== 'NEXUS_QUANT_BRANCH_HYGIENE_ARCHIVE') {
              throw new Error('Unexpected branch hygiene archive kind.');
            }
            if (!Array.isArray(archive.branches)) {
              throw new Error('Branch hygiene archive requires branches array.');
            }
            const archivedByName = new Map();
            for (const item of archive.branches) {
              if (
                !item ||
                typeof item.name !== 'string' ||
                typeof item.sha !== 'string' ||
                !/^[0-9a-f]{40}$/.test(item.sha)
              ) {
                throw new Error('Invalid branch hygiene archive entry.');
              }
              if (archivedByName.has(item.name)) {
                throw new Error(`Duplicate archived branch: ${item.name}`);
              }
              archivedByName.set(item.name, item.sha);
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const rawNonCanonical = branches.filter(
              b => b.name !== defaultBranch && b.name !== 'main'
            );
            const archived = [];
            const archiveDrift = [];
            const nonCanonical = [];
            for (const branch of rawNonCanonical) {
              const expectedSha = archivedByName.get(branch.name);
              if (expectedSha === branch.commit.sha) {
                archived.push(branch);
                continue;
              }
              if (expectedSha) {
                archiveDrift.push({
                  name: branch.name,
                  expectedSha,
                  actualSha: branch.commit.sha,
                });
              }
              nonCanonical.push(branch);
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref)
            );

            const stale = [];
            const now = Date.now();

            for (const branch of nonCanonical) {
              if (openHeads.has(branch.name)) continue;

              const commit = await github.rest.repos.getCommit({
                owner, repo, ref: branch.commit.sha,
              });
              const dateText =
                commit.data.commit?.committer?.date ||
                commit.data.commit?.author?.date;

              if (!dateText) continue;

              const ageDays = Math.floor((now - new Date(dateText).getTime()) / 86400000);
              if (ageDays >= staleDays) {
                stale.push({
                  name: branch.name,
                  ageDays,
                  sha: branch.commit.sha,
                });
              }
            }

            const excessive = nonCanonical.length > maxBranches;

            const reportLines = [
              '## Automated Branch Hygiene Report',
              '',
              `Default branch: \`${defaultBranch}\``,
              `Total non-canonical branches: **${rawNonCanonical.length}**`,
              `Archived historical branches (exact SHA): **${archived.length}**`,
              `Active/unclassified non-canonical branches: **${nonCanonical.length}** (warning threshold: ${maxBranches})`,
              `Stale threshold: **${staleDays} days**`,
              '',
              '### Archive integrity',
              archiveDrift.length
                ? archiveDrift.map(b => `- DRIFT \`${b.name}\` expected \`${b.expectedSha.slice(0, 12)}\` actual \`${b.actualSha.slice(0, 12)}\``).join('\\n')
                : '- All present archived branches match their registered SHA.',
              '',
              '### Safety policy',
              '- Branches with exact proof of a merged same-repository PR are deleted automatically.',
              '- Unprotected branches with no open PR and GitHub compare `ahead_by=0` are also deleted automatically because they contain no unique commits.',
              '- Unmerged branches with unique commits are **report-only** and are never deleted automatically.',
              '- Historical unique branches may be excluded from active-count warnings only by exact branch-name + SHA archive registration.',
              '- Any archived branch SHA drift automatically returns that branch to active audit scope.',
              '',
              '### Stale branches without an open PR',
              stale.length
                ? stale.map(b => `- \`${b.name}\` — ${b.ageDays} days — \`${b.sha.slice(0, 12)}\``).join('\n')
                : '- None',
              '',
              excessive
                ? '⚠️ Branch count is above the configured warning threshold.'
                : '✅ Branch count is within the configured threshold.',
              '',
              `Generated by Branch Hygiene workflow run ${context.runId}.`,
            ];

            const body = reportLines.join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issue = existing.find(i => !i.pull_request && i.title === process.env.REPORT_TITLE);

            if (stale.length || excessive) {
              if (issue) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, body,
                });
                core.warning(`Updated branch hygiene issue #${issue.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo,
                  title: process.env.REPORT_TITLE,
                  body,
                });
                core.warning(`Created branch hygiene issue #${created.data.number}`);
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'Branch inventory is clean. Closing this automated hygiene report.',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
              core.notice(`Closed clean branch hygiene issue #${issue.number}`);
            } else {
              core.notice('Branch inventory is clean.');
            }

            if (excessive) {
              core.setFailed(`Active non-canonical branch count ${nonCanonical.length} exceeds threshold ${maxBranches}.`);
            }
