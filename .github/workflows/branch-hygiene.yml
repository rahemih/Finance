name: Branch Hygiene

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged task branch
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const defaultBranch = context.payload.repository.default_branch || 'main';

            if (!branch || branch === defaultBranch || branch === 'main') {
              core.info(`Skip protected/canonical branch: ${branch}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.notice(`Deleted merged branch: ${branch}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`Branch already absent or not deletable: ${branch}`);
                return;
              }
              throw error;
            }

  cleanup-known-merged:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches proven merged
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref)
            );

            for (const branch of branches) {
              if (branch.name === defaultBranch || branch.name === 'main') continue;
              if (openHeads.has(branch.name)) {
                core.info(`Keep open-PR branch: ${branch.name}`);
                continue;
              }

              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: branch.commit.sha,
                  per_page: 100,
                }
              );

              const provenMerged = associated.some(pr =>
                pr.merged_at &&
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                pr.head.ref === branch.name &&
                pr.head.sha === branch.commit.sha
              );

              if (!provenMerged) {
                core.info(`Keep branch without exact merged-PR proof: ${branch.name}`);
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                core.notice(`Deleted previously merged branch: ${branch.name}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent or not deletable: ${branch.name}`);
                  continue;
                }
                throw error;
              }
            }

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [cleanup-known-merged]
    runs-on: ubuntu-latest
    env:
      STALE_DAYS: "30"
      MAX_NON_CANONICAL_BRANCHES: "12"
      REPORT_TITLE: "[BRANCH-HYGIENE] Stale or excessive branches"
    steps:
      - name: Audit branch inventory
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const staleDays = Number(process.env.STALE_DAYS);
            const maxBranches = Number(process.env.MAX_NON_CANONICAL_BRANCHES);
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const nonCanonical = branches.filter(b => b.name !== defaultBranch && b.name !== 'main');

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref)
            );

            const stale = [];
            const now = Date.now();

            for (const branch of nonCanonical) {
              if (openHeads.has(branch.name)) continue;

              const commit = await github.rest.repos.getCommit({
                owner, repo, ref: branch.commit.sha,
              });
              const dateText =
                commit.data.commit?.committer?.date ||
                commit.data.commit?.author?.date;

              if (!dateText) continue;

              const ageDays = Math.floor((now - new Date(dateText).getTime()) / 86400000);
              if (ageDays >= staleDays) {
                stale.push({
                  name: branch.name,
                  ageDays,
                  sha: branch.commit.sha,
                });
              }
            }

            const excessive = nonCanonical.length > maxBranches;

            const reportLines = [
              '## Automated Branch Hygiene Report',
              '',
              `Default branch: \`${defaultBranch}\``,
              `Non-canonical branch count: **${nonCanonical.length}** (warning threshold: ${maxBranches})`,
              `Stale threshold: **${staleDays} days**`,
              '',
              '### Safety policy',
              '- Branches with exact proof of a merged same-repository PR are deleted automatically.',
              '- Unmerged stale branches are **report-only** and are never deleted automatically.',
              '',
              '### Stale branches without an open PR',
              stale.length
                ? stale.map(b => `- \`${b.name}\` — ${b.ageDays} days — \`${b.sha.slice(0, 12)}\``).join('\n')
                : '- None',
              '',
              excessive
                ? '⚠️ Branch count is above the configured warning threshold.'
                : '✅ Branch count is within the configured threshold.',
              '',
              `Generated by Branch Hygiene workflow run ${context.runId}.`,
            ];

            const body = reportLines.join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issue = existing.find(i => !i.pull_request && i.title === process.env.REPORT_TITLE);

            if (stale.length || excessive) {
              if (issue) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, body,
                });
                core.warning(`Updated branch hygiene issue #${issue.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo,
                  title: process.env.REPORT_TITLE,
                  body,
                });
                core.warning(`Created branch hygiene issue #${created.data.number}`);
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'Branch inventory is clean. Closing this automated hygiene report.',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
              core.notice(`Closed clean branch hygiene issue #${issue.number}`);
            } else {
              core.notice('Branch inventory is clean.');
            }

            if (excessive) {
              core.setFailed(`Non-canonical branch count ${nonCanonical.length} exceeds threshold ${maxBranches}.`);
            }
