name: P24 Owner Review Exception RFC Validation

on:
  pull_request:
    paths:
      - "contracts/tasks/FIN-P24-WT-001.json"
      - "docs/00-governance/P24-SOLO-OWNER-REVIEW-EXCEPTION-RFC.md"
      - "config/governance/p24-offline-solo-review-proposal.json"
      - "scripts/ci/p24wt_review_policy.py"
      - "tests/p24/test_p24wt_review_policy.py"
      - ".github/workflows/p24-review-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p24-wt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review_proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'

      - name: Verify all 32 no-bypass policy tests
        run: python -m unittest discover -s tests/p24 -p 'test_p24wt_review_policy.py' -v

      - name: Reproduce owner-UNAPPROVED policy evidence twice
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/ci/p24wt_review_policy.py --output build/p24wt-a.json
          PYTHONPATH=. python scripts/ci/p24wt_review_policy.py --output build/p24wt-b.json
          cmp build/p24wt-a.json build/p24wt-b.json
          sha256sum build/p24wt-a.json

      - name: Upload proposal only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p24-wt-owner-review-proposal-NOT-APPROVED
          path: build/p24wt-a.json
          if-no-files-found: error
          retention-days: 7
