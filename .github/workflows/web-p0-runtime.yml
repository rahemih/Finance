name: WEB-P0 Runtime Lock Preparation (DRAFT)

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-p0-runtime.yml'
      - 'contracts/tasks/FIN-P23-WL-001.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-runtime-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Prepare exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.4 --activate
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "11.28.4"
      - name: Resolve lockfile without lifecycle scripts (precommit evidence only)
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Emit deterministic generated lockfile for governed commit
        shell: bash
        run: |
          echo 'BEGIN_WEB_P0_GENERATED_LOCKFILE'
          cat pnpm-lock.yaml
          echo 'END_WEB_P0_GENERATED_LOCKFILE'
      - name: Source-only runtime safety tests
        run: node --test apps/web/tests/runtime-contract.test.mjs
