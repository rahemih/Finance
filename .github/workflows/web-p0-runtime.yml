name: WEB-P0 Runtime Frozen Build (DRAFT / NOT ACCEPTANCE)

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-p0-runtime.yml'
      - 'contracts/tasks/FIN-P23-WL-001.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node exact
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.4 --activate
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "11.28.4"
      - name: Frozen install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Runtime dependency constraints
        run: node --test apps/web/tests/runtime-contract.test.mjs
      - name: Existing WEB-P0 source contract tests
        run: python3 -m unittest discover -s tests/web_p0 -p 'test_*.py' -v
      - name: Pinned TypeScript exact typecheck
        run: pnpm --filter @nexus-quant/web run typecheck
      - name: Real Next.js build (non-operational root sentinel)
        run: pnpm --filter @nexus-quant/web run build
      - name: HTTP non-operational smoke and denied routes
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec next start --hostname 127.0.0.1 -p 3100 > "$RUNNER_TEMP/web-next-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3100/ > "$RUNNER_TEMP/web-root.html"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/web-next-smoke.log"; exit 1; fi
          grep -F 'پیش‌نمایش WEB-P0 هنوز فعال نیست' "$RUNNER_TEMP/web-root.html"
          grep -Ei 'name="robots" content="noindex[, ]+nofollow"' "$RUNNER_TEMP/web-root.html"
          # Three read-only source previews, never an API or Auth service.
          for path in /dashboard /system /system/alerts /markets /markets/watchlist /markets/BTCUSDT; do
            file="$RUNNER_TEMP/preview-$(echo "$path" | tr / -).html"
            code=$(curl --silent --output "$file" --write-out '%{http_code}' --max-time 5 "http://127.0.0.1:3100$path")
            test "$code" = "200" || { echo "Expected read-only preview $path: 200 (got $code)"; exit 1; }
            grep -F 'بدون داده زنده' "$file"
            grep -F 'PREVIEW ONLY' "$file"
            grep -Ei 'name="robots" content="noindex[, ]+nofollow"' "$file"
            denied=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST --max-time 5 "http://127.0.0.1:3100$path")
            test "$denied" -ge 400 || { echo "POST must be denied $path ($denied)"; exit 1; }
          done
          for path in /auth/login /api/v1/orders; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "http://127.0.0.1:3100$path")
            test "$code" = "404" || { echo "Must remain absent $path: $code"; exit 1; }
          done
          curl --silent --head --fail http://127.0.0.1:3100/ | grep -i '^x-frame-options: DENY'
      - name: Capture real Chromium viewport screenshots (not approved visual baseline)
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p "$RUNNER_TEMP/web-p0-previews"
          pnpm --dir apps/web exec next start --hostname 127.0.0.1 -p 3101 > "$RUNNER_TEMP/web-monitoring-chrome.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3101/dashboard >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          for record in "010:dashboard" "079:system" "084:system/alerts" "011:markets" "015:markets/watchlist" "019:markets/BTCUSDT"; do
            page_id="${record%%:*}"
            route="${record#*:}"
            for width in 1440 768 360; do
              file="$RUNNER_TEMP/web-p0-previews/${page_id}-${width}-unapproved.png"
              google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --disable-background-networking --hide-scrollbars --force-device-scale-factor=1 --window-size="$width,960" --virtual-time-budget=1500 --screenshot="$file" "http://127.0.0.1:3101/$route" > "$RUNNER_TEMP/chrome-$page_id-$width.log" 2>&1 || { cat "$RUNNER_TEMP/chrome-$page_id-$width.log"; exit 1; }
              test -s "$file" || { echo "Missing screenshot: $file"; exit 1; }
            done
          done
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"web-p0-previews"
          files=sorted(root.glob("*.png"))
          assert len(files)==18, f"expected eighteen browser captures, got {len(files)}"
          info=[]
          for p in files:
              b=p.read_bytes()
              assert b[:8]==b"\x89PNG\r\n\x1a\n", p
              w,h=struct.unpack(">II", b[16:24])
              assert w in (360,768,1440), (p.name,w)
              assert h>=600,(p.name,h)
              info.append(dict(file=p.name,width=w,height=h,sha256=hashlib.sha256(b).hexdigest(),approval="NOT_VISUALLY_REVIEWED"))
          (root/"manifest.json").write_text(json.dumps({"run":"WEB-P0 P0-B/P0-C screenshot evidence; NOT approved reference baseline", "count":len(info),"captures":info},indent=2),encoding="utf-8")
          print(json.dumps(info,ensure_ascii=False))
          PY
      - name: Upload viewport screenshots (evidence only, no owner acceptance)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: web-p0-monitoring-markets-viewport-evidence
          path: ${{ runner.temp }}/web-p0-previews/
          if-no-files-found: error
          retention-days: 14
      - name: WEB-P0 Monitoring P0-B source contracts
        run: |
          node --experimental-strip-types --test apps/web/tests/monitoring-contract.test.mjs
          node --test apps/web/tests/markets-contract.test.mjs
          python3 -m unittest discover -s tests/web_p0 -p test_monitoring_source.py -v
      - name: Supply chain audit (HIGH+ fail closed)
        run: pnpm audit --audit-level high
      - name: Research exact dependency license metadata (not waiver or approval)
        run: node apps/web/scripts/collect-npm-license-evidence.mjs
