name: P24 Offline Preproduction Lab

on:
  pull_request:
    paths:
      - "contracts/tasks/FIN-P24-WO-001.json"
      - "config/production/p24-offline-lab-policy.json"
      - "packages/production/offline_preproduction_lab.py"
      - "tests/p24/test_offline_preproduction_lab.py"
      - "scripts/ci/p24wo_evidence.py"
      - ".github/workflows/p24-offline-lab.yml"
      - "docs/19-production/P24-WO-OFFLINE-LAB.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p24-wo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline_lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'

      - name: P24 offline lab deterministic negative tests
        run: python -m unittest discover -s tests/p24 -p 'test_offline_preproduction_lab.py' -v

      - name: P24 offline lab evidence and dashboard twice
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/ci/p24wo_evidence.py --json build/p24wo-a/report.json --html build/p24wo-a/dashboard.html --csv build/p24wo-a/scenarios.csv
          PYTHONPATH=. python scripts/ci/p24wo_evidence.py --json build/p24wo-b/report.json --html build/p24wo-b/dashboard.html --csv build/p24wo-b/scenarios.csv
          cmp build/p24wo-a/report.json build/p24wo-b/report.json
          cmp build/p24wo-a/dashboard.html build/p24wo-b/dashboard.html
          cmp build/p24wo-a/scenarios.csv build/p24wo-b/scenarios.csv
          sha256sum build/p24wo-a/report.json build/p24wo-a/dashboard.html build/p24wo-a/scenarios.csv

      - name: Upload bounded synthetic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p24-wo-synthetic-evidence
          path: |
            build/p24wo-a/report.json
            build/p24wo-a/dashboard.html
            build/p24wo-a/scenarios.csv
          if-no-files-found: error
          retention-days: 7
