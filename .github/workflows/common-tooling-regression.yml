name: Common Tooling Safety Regression

on:
  pull_request:
    paths:
      - 'scripts/dev/common.py'
      - 'tests/foundation/test_common_tooling_safety.py'
      - '.github/workflows/common-tooling-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-tooling-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run isolated standard-library regressions
        run: python3 -m unittest discover -s tests/foundation -p 'test_common_tooling_safety.py' -v
