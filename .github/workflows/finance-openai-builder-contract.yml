name: Finance Direct OpenAI Builder Contract Tests

on:
  pull_request:
    paths:
      - 'scripts/automation/openai_coder.py'
      - 'scripts/automation/openai_verify.py'
      - 'tests/automation/test_openai_coder.py'
      - 'docs/09-agents/automation/tasks/FIN-P24-WZ-008.json'
      - '.github/workflows/finance-openai-builder.yml'
      - '.github/workflows/finance-openai-builder-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nq-openai-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline_operational_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Compile and check JSON task
        run: |
          python -m py_compile scripts/automation/openai_coder.py scripts/automation/openai_verify.py
          python -m json.tool docs/09-agents/automation/tasks/FIN-P24-WZ-008.json >/dev/null
      - name: Run all strict offline negative/operational tests
        run: python -m unittest discover -s tests/automation -p 'test_openai_coder.py' -v
      - name: Verify hard-separated model/test/publisher workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          content=Path('.github/workflows/finance-openai-builder.yml').read_text()
          assert 'OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}' in content
          assert 'name: Finance Direct OpenAI Governed Builder' in content
          assert '  validate:' in content and '  publish:' in content
          assert 'if: needs.validate.outputs.verified' in content
          assert 'pull-requests: write' in content
          assert '--draft' in content
          assert 'gh pr merge' not in content
          assert 'copilot' not in content.lower()
          assert 'Live Trading' not in content
          print('FIN_OPENAI_FOOTPRINT=PASS')
          PY
