services:
  - type: web
    name: nq-agent-mission-control
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.mission-control
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NQ_PUBLIC_ORIGIN
        sync: false
      - key: NQ_INGEST_TOKEN
        generateValue: true
      - key: NQ_GITHUB_POLL_SECONDS
        value: "300"
    disk:
      name: mission-event-journal
      mountPath: /data
      sizeGB: 1
